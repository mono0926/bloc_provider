  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.0
  pedantic_mono: ^1.39.0
  rxdart: ^0.28.0
